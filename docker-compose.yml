services:
  postgres:
    image: postgres:16
    container_name: vaultscale_postgres
    environment:
      POSTGRES_USER: vaultscale
      POSTGRES_PASSWORD: vaultscale123
      POSTGRES_DB: vaultscale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultscale -d vaultscale"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Audit-service owns this database and never shares the monolith's tables.
  audit-postgres:
    image: postgres:16
    container_name: vaultscale_audit_postgres
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audituser
      POSTGRES_PASSWORD: auditpass123
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audituser -d audit_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ZooKeeper manages Kafka metadata and coordination.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: vaultscale_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Kafka event broker.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vaultscale_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7
    container_name: vaultscale_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ─── Nginx Reverse Proxy — single public entry point ──────────────────
  nginx:
    build: ./infra/nginx
    container_name: vaultscale_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"   # ONLY this port is exposed to the outside world now
      # ─── Prometheus — scrapes and stores time-series metrics ──────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: vaultscale_prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # ─── Grafana — visualizes Prometheus data as dashboards ───────────────
  grafana:
    image: grafana/grafana:latest
    container_name: vaultscale_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123   # change this in real production use
    depends_on:
      - prometheus
  # Backend (Spring Boot)
  backend:
    build: ./backend
    container_name: vaultscale_backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vaultscale
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  # Standalone Kafka consumer; audit data is persisted only in audit-postgres.
  audit-service:
    build: ./services/audit-service
    container_name: vaultscale_audit_service
    depends_on:
      audit-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://audit-postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: audituser
      SPRING_DATASOURCE_PASSWORD: auditpass123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: vaultscale-audit-service
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  # ─── Certbot — fetches and auto-renews free Let's Encrypt SSL certs ────────
  certbot:
    image: certbot/certbot
    container_name: vaultscale_certbot
    volumes:
      - ./infra/nginx/certbot/www:/var/www/certbot        # shared with nginx for domain verification
      - ./infra/nginx/certbot/conf:/etc/letsencrypt        # stores the issued certificates
  # Frontend (React, served by nginx)
  frontend:
    build: ./frontend
    container_name: vaultscale_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  postgres_data:
  audit_postgres_data:
