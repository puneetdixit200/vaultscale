spring:
  application:
    name: audit-service

  datasource:
    # Host-run defaults. Docker Compose overrides these with audit-postgres:5432.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/audit_db}
    username: ${SPRING_DATASOURCE_USERNAME:audituser}
    password: ${SPRING_DATASOURCE_PASSWORD:auditpass123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  kafka:
    # Host-run default. Docker Compose overrides this with kafka:29092.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:vaultscale-audit-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.vaultscale.audit.event.DomainEvent
        spring.json.trusted.packages: com.vaultscale.audit.event,com.vaultscale.event.dto
        # Accept events from already-running monolith instances during rollout.
        spring.json.type.mapping: com.vaultscale.event.dto.DomainEvent:com.vaultscale.audit.event.DomainEvent

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
