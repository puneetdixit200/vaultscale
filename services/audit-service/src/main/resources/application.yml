spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://audit-postgres:5432/audit_db}
    username: ${SPRING_DATASOURCE_USERNAME:audituser}
    password: ${SPRING_DATASOURCE_PASSWORD:auditpass123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:vaultscale-audit-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.vaultscale.audit.event.DomainEvent
        spring.json.trusted.packages: com.vaultscale.audit.event,com.vaultscale.event.dto
        # Accept events from already-running monolith instances during rollout.
        spring.json.type.mapping: com.vaultscale.event.dto.DomainEvent:com.vaultscale.audit.event.DomainEvent

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
