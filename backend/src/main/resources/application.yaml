spring:
  application:
    name: VaultScale

  # Database connection
  datasource:
    url: jdbc:postgresql://localhost:5432/vaultscale
    username: vaultscale
    password: vaultscale123
    driver-class-name: org.postgresql.Driver

  # JPA Java Persistence API and Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: vaultscale-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.vaultscale.event.dto.DomainEvent
        spring.json.trusted.packages: com.vaultscale.event.dto

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
        # ─── Cache Configuration ──────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 60000   # cache entries auto-expire after 60 seconds (prevents stale data forever)
# Backend HTTP port
server:
  port: 8080

# Custom JWT configuration
app:
  jwt:
    secret: vaultscale-super-secret-key-change-me-2026
    expiration: 86400000

# Health checks and metrics
# # ─── Actuator (Health Checks & Metrics) — EXPANDED for Phase 8 ─────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # added "prometheus" for scraping-friendly format
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true          # enables /actuator/health/liveness and /readiness (used by Docker/K8s)
  metrics:
    tags:
      application: vaultscale  # tags every metric with our app name — useful when multiple services exist
  health:
    kafka:
      enabled: true            # health check pings Kafka too, not just PostgreSQL
      # ─── Resilience4j Circuit Breaker Configuration ─────────────────────────
      resilience4j:
        circuitbreaker:
          instances:
            externalApiRunner:                    # this name MUST match the annotation's "name" attribute
              # how many of the last N calls to look at when deciding to trip
              sliding-window-size: 10
              # % of those calls that must fail to trip the breaker OPEN
              failure-rate-threshold: 50
              # how long to stay OPEN before trying HALF_OPEN test calls
              wait-duration-in-open-state: 15s
              # how many test calls to allow through during HALF_OPEN
              permitted-number-of-calls-in-half-open-state: 3
              # count SLOW calls (not just failed ones) as failures too
              slow-call-duration-threshold: 8s
              slow-call-rate-threshold: 50
        # Also expose circuit breaker health/state via Actuator (ties into Phase 8 observability)
        metrics:
          enabled: true
