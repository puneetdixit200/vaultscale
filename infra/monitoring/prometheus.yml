# infra/monitoring/prometheus.yml
global:
  scrape_interval: 15s   # pull fresh metrics every 15 seconds

scrape_configs:
  - job_name: 'vaultscale-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']   # "backend" = the container name in docker-compose.yml
