# infra/monitoring/loki/promtail-config.yml
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml   # tracks what's already been read, so restarts don't re-send old logs

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Attaches the container name as a searchable label in Grafana
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
