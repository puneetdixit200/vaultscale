# infra/nginx/nginx.conf
# Nginx acts as the single public entry point for VaultScale.
# It routes /api/* to the backend and everything else to the frontend.

events {
    worker_connections 1024;   # max simultaneous connections Nginx can handle
}

http {
    # ─── Upstream blocks: define WHERE traffic goes ────────────────────────
    # These names ("backend", "frontend") are the container names from docker-compose.yml
    upstream backend_upstream {
        server backend:8080;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    # ─── Rate limiting: basic DoS protection ────────────────────────────────
    # Limits any single IP to 10 requests/second on auth endpoints — prevents brute-force login attempts
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name vaultscale.local;   # replace with your real domain when deploying

        # ─── Route 1: API requests go to the Spring Boot backend ───────────
        location /api/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://backend_upstream;

            # These headers preserve the original client info for the backend to see
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Nginx is the same-origin boundary; do not send a browser Origin
            # through to Spring's direct-origin CORS filter.
            proxy_set_header Origin "";
        }

        # ─── Route 2: Actuator health/metrics — internal monitoring only ───
        location /actuator/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Origin "";
            # In production, restrict this further, e.g. allow only internal IPs:
            # allow 10.0.0.0/8; deny all;
        }

        # ─── Route 3: everything else goes to the Next.js frontend ─────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
